name: deploy-cloudflare-book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up book environment
        uses: ./.github/actions/setup-book

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install --no-save wrangler

      # Executed notebooks are cached by a hash of their code cells (execute_notebooks: cache),
      # so only notebooks whose code changed are re-run. The key includes the dependency files:
      # changing them starts a fresh cache and re-executes everything.
      - name: Restore notebook execution cache
        uses: actions/cache@v4
        with:
          path: book/_build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('requirements.txt', '.github/actions/setup-book/action.yml') }}-${{ github.sha }}
          restore-keys: |
            jupyter-cache-${{ hashFiles('requirements.txt', '.github/actions/setup-book/action.yml') }}-

      - name: Build student book
        run: |
          python3 ci/generate_book.py student
          jupyter-book build book
          python3 ci/parse_html_for_errors.py student

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
