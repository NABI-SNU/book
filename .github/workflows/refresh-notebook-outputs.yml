name: refresh-notebook-outputs

# Re-executes the heavy notebooks listed under execute.exclude_patterns in book/_config.yml
# and commits their outputs, which the book build renders without running them.
#
# Run it by adding the `refresh-outputs` label to a pull request (from this repository),
# or manually from the Actions tab on a branch. Commits pushed by this workflow do not
# trigger other workflows, so re-run the PR's build check afterwards if you need it.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-notebook-outputs-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'refresh-outputs' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up book environment
        uses: ./.github/actions/setup-book

      - name: Execute heavy notebooks
        run: |
          pip install nbclient nbformat ipykernel
          python ci/refresh_outputs.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $(python ci/refresh_outputs.py --list)
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git commit -m "Refresh outputs of pre-executed notebooks"
          git push
